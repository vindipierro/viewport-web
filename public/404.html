<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06101f" />
    <title>Page Not Found | Viewport Works</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap');

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at 80% 10%, rgba(47, 107, 255, 0.14), transparent 32%),
          linear-gradient(180deg, #071326 0%, #030812 100%);
        color: #f4f7fb;
        font-family: 'DM Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(560px, 100%);
        text-align: center;
      }

      .mark {
        width: 68px;
        height: 68px;
        object-fit: contain;
        margin-bottom: 30px;
        filter: drop-shadow(0 0 26px rgba(47, 107, 255, 0.2));
      }

      .code {
        margin: 0 0 12px;
        color: #8fb2ff;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: 'Manrope', sans-serif;
        font-size: clamp(44px, 8vw, 72px);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: .98;
      }

      p {
        margin: 20px auto 0;
        max-width: 430px;
        color: #9eacc1;
        font-size: 16px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 30px;
        padding: 0 21px;
        border: 1px solid #f5f7fb;
        border-radius: 999px;
        background: #f5f7fb;
        color: #071120;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: transform .2s ease, box-shadow .2s ease;
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 45px rgba(47, 107, 255, .2);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/viewport-mark-reverse.png" alt="Viewport Works" />
      <div class="code">404</div>
      <h1>Page not found.</h1>
      <p>The page you’re looking for doesn’t exist or may have moved.</p>
      <a href="/">Back to Viewport Works</a>
    </main>
  </body>
</html>
