name: Generate logo PNG assets

on:
  push:
    paths:
      - scripts/generate_logo_png.py
      - .github/workflows/generate-logo-png.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/generate_logo_png.py
      - name: Commit PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/viewport-mark.png public/viewport-mark-reverse.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate Viewport logo PNG assets"
          git push
